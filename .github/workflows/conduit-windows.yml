name: Build Conduit Windows

on:
  push:
    branches:
      - main
    paths:
      - "conduit/**"
      - "packages/**"
      - ".github/workflows/conduit-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    branches:
      - main
    paths:
      - "conduit/**"
      - "packages/**"
      - ".github/workflows/conduit-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

env:
  CI: true
  LEYLINE_HUB_HTTP_URL: https://api.shoma.lol
  LEYLINE_HUB_WS_URL: wss://api.shoma.lol

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Fix cargo PATH
        shell: bash
        run: |
          CARGO_BIN=$(dirname $(rustup which cargo))
          echo "$CARGO_BIN" >> $GITHUB_PATH

      - name: Verify cargo
        run: cargo --version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: conduit/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEYLINE_HUB_HTTP_URL: https://api.shoma.lol
          LEYLINE_HUB_WS_URL: wss://api.shoma.lol
        with:
          projectPath: ./conduit
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: conduit-v__VERSION__
          releaseName: "Conduit v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
