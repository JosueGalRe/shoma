name: Build Conduit macOS

on:
  push:
    branches:
      - main
    paths:
      - "conduit/**"
      - "packages/**"
      - ".github/workflows/conduit-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    branches:
      - main
    paths:
      - "conduit/**"
      - "packages/**"
      - ".github/workflows/conduit-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

env:
  CI: true
  LEYLINE_HUB_HTTP_URL: https://api.shoma.lol
  LEYLINE_HUB_WS_URL: wss://api.shoma.lol

jobs:
  build-mac:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ensure macOS ARM64 target is installed
        run: rustup target add aarch64-apple-darwin

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: conduit/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Verify Rust toolchain
        run: |
          rustup show
          rustup run stable cargo --version

      - name: Install Tauri CLI
        run: rustup run stable cargo install tauri-cli

      - name: Build Tauri app
        run: rustup run stable cargo tauri build --target aarch64-apple-darwin
        working-directory: conduit/src-tauri
        env:
          LEYLINE_HUB_HTTP_URL: https://api.shoma.lol
          LEYLINE_HUB_WS_URL: wss://api.shoma.lol

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        working-directory: conduit/src-tauri

      - name: Upload to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: conduit/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          tag_name: conduit-v${{ steps.get_version.outputs.version }}
          name: Conduit v${{ steps.get_version.outputs.version }}
          body: "See the assets to download this version and install."
          draft: true
