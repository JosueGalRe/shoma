name: Build Conduit macOS

on:
  push:
    branches:
      - main
    paths:
      - "conduit/**"
      - "packages/**"
      - ".github/workflows/conduit-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  pull_request:
    branches:
      - main
    paths:
      - "conduit/**"
      - "packages/**"
      - ".github/workflows/conduit-*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

env:
  CI: true

jobs:
  build-mac:
    name: Build macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Ensure macOS ARM64 target is installed
        run: rustup target add aarch64-apple-darwin

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: conduit/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build frontend
        run: pnpm run build
        working-directory: conduit

      - name: Build Tauri app
        run: cargo tauri build --target aarch64-apple-darwin
        working-directory: conduit/src-tauri

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: conduit-macos-dmg
          path: conduit/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: conduit-macos-app
          path: conduit/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
