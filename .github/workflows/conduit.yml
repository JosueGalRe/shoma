name: Build Conduit

on:
  push:
    branches:
      - main
    tags:
      - 'conduit-v*'
    paths:
      - 'conduit/**'
      - 'packages/**'
      - '.github/workflows/conduit*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    branches:
      - main
    paths:
      - 'conduit/**'
      - 'packages/**'
      - '.github/workflows/conduit*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
env:
  CI: true
  LEYLINE_HUB_HTTP_URL: https://api.shoma.lol
  LEYLINE_HUB_WS_URL: wss://api.shoma.lol
  LOOM_WEB_URL: https://app.shoma.lol

jobs:
  ci:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Fix cargo PATH
        shell: bash
        run: |
          CARGO_BIN=$(dirname $(rustup which cargo))
          echo "$CARGO_BIN" >> $GITHUB_PATH

      - name: Verify cargo
        run: cargo --version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev pkg-config

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: conduit/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Cargo check
        run: cargo check --manifest-path conduit/src-tauri/Cargo.toml

      - name: Check frontend
        run: pnpm --filter @shoma/conduit exec vp check

      - name: Build frontend
        run: pnpm --filter @shoma/conduit exec vp build

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/conduit-v')
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc --bundles nsis'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Ensure macOS ARM64 target is installed
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Fix cargo PATH
        shell: bash
        run: |
          CARGO_BIN=$(dirname $(rustup which cargo))
          echo "$CARGO_BIN" >> $GITHUB_PATH

      - name: Verify cargo
        run: cargo --version

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: conduit/src-tauri
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Extract changelog for release
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#conduit-v}"
          BODY=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ { if (found) exit }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found { print }
          ' conduit/CHANGELOG.md | sed '/^$/d')

          if [ -z "$BODY" ]; then
            echo "No changelog entry found for v$VERSION. Expected a matching version heading in conduit/CHANGELOG.md." >&2
            exit 1
          fi

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./conduit
          args: ${{ matrix.args }}
          tagName: conduit-v__VERSION__
          releaseName: 'Conduit v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          retryAttempts: 3
