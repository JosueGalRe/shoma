packages:
  - 'loom'
  - 'leyline'
  - 'conduit'
  - 'packages/*'

catalog:
  typescript: ^7.0.2
  '@types/bun': ^1.4.4
  effect: ^4.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  lucide-react: ^1.70.0
  tailwind-variants: ^4.0.1
  '@radix-ui/react-dropdown-menu': ^2.2.1
  '@radix-ui/react-scroll-area': ^1.4.0
  '@tailwindcss/vite': ^4.3.5
  tailwindcss: ^4.3.5
  '@vitejs/plugin-react': ^6.2.1
  vite-plus: ^1.5.0
  shadcn: ^4.23.0

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest@*: 5.1.0

strictPeerDependencies: false
autoInstallPeers: true

allowBuilds:
  msw: true
  msgpackr-extract: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
# Old releases predate provenance/trusted publishing; takeover risk is in fresh publishes
trustPolicyIgnoreAfter: 43200
